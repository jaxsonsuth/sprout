[[bin]]
name = "benchmark_serialization"
path = "src/bin/benchmark_serialization.rs"

[[bin]]
name = "sprout-server"
path = "src/main.rs"

[package]
name = "sprout-server"
version = "0.1.0"
edition = "2024"
default-run = "sprout-server"

[dependencies]
axum = { version = "0.8.7", features = ["macros"] }
llama-cpp-2 = { version = "0.1.125", features = ["metal"] }
reqwest = { version = "0.12.24", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-stream = "0.3"
tokio-stream = "0.1"
