name: Build and Test

on:
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: default-runner

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cd server; cargo build --verbose
      - name: Run tests
        run: cd server; cargo test --verbose
